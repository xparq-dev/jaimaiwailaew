<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>ออฟไลน์ | จ่ายไม่ไหวแล้ว</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
        background: #f5f7fa;
        color: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }
      main {
        width: min(100%, 600px);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid #d8e0ea;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(11 31 58 / 10%);
      }
      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        border-radius: 16px;
        background: #fff7df;
        color: #85400a;
        font-size: 28px;
        place-items: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        line-height: 1.3;
      }
      p {
        margin: 0 0 16px;
        color: #475569;
        line-height: 1.7;
      }
      .notice {
        padding: 16px;
        border-left: 4px solid #0e8f68;
        border-radius: 8px;
        background: #e5f7f0;
        color: #087052;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        padding: 10px 18px;
        align-items: center;
        border-radius: 10px;
        background: #0e8f68;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        border: 1px solid #d8e0ea;
        background: transparent;
        color: inherit;
      }
      a:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0b1220;
          color: #f8fafc;
        }
        main {
          border-color: #293548;
          background: #121c2d;
          box-shadow: none;
        }
        p {
          color: #a9b7ca;
        }
        .notice {
          background: #0c352b;
          color: #7ce5bf;
        }
        a.secondary {
          border-color: #293548;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">☁</div>
      <h1>หน้านี้ยังไม่ได้เตรียมไว้สำหรับออฟไลน์</h1>
      <p>
        หน้าสาธารณะของเครื่องคำนวณที่เคยเตรียมไว้ยังเปิดใช้งานได้
        แต่การเข้าสู่ระบบและ Cloud Sync ต้องเชื่อมต่ออินเทอร์เน็ต
      </p>
      <p class="notice">
        ข้อมูลการเงินยังอยู่ใน Local Storage ของอุปกรณ์ และไม่ได้ถูกเก็บใน PWA
        cache
      </p>
      <div class="actions">
        <a href="/calculator">เปิดเครื่องคำนวณ</a>
        <a class="secondary" href="/">ลองหน้าแรกอีกครั้ง</a>
      </div>
    </main>
  </body>
</html>
