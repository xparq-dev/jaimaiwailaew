<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>ออฟไลน์ | จ่ายไม่ไหวแล้ว</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          "Noto Sans Thai",
          "IBM Plex Sans Thai",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f5f7fa;
        color: #0b1f3a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid #d9e1ea;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 16px 48px rgb(11 31 58 / 10%);
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        border-radius: 16px;
        background: #0b1f3a;
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        place-items: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        line-height: 1.25;
      }

      p {
        margin: 0 0 16px;
        color: #3e4d62;
        line-height: 1.7;
      }

      .notice {
        padding: 16px;
        border-left: 4px solid #2563eb;
        border-radius: 8px;
        background: #edf4ff;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        margin-top: 8px;
        padding: 10px 18px;
        align-items: center;
        border-radius: 10px;
        background: #0e8f68;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0b1220;
          color: #f5f7fa;
        }

        main {
          border-color: #28354a;
          background: #121c2d;
          box-shadow: none;
        }

        p {
          color: #cbd5e1;
        }

        .notice {
          background: #17284a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">฿</div>
      <h1>ขณะนี้คุณกำลังออฟไลน์</h1>
      <p>
        ไม่สามารถเปิดหน้านี้จากเครือข่ายได้
        โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองอีกครั้ง
      </p>
      <p class="notice">
        เมื่อมีเครื่องคำนวณแบบออฟไลน์ ผลลัพธ์จะใช้กฎภาษีที่บันทึกล่าสุดในอุปกรณ์
        และต้องตรวจสอบข้อมูลล่าสุดก่อนนำไปใช้ประกอบการยื่นภาษี
      </p>
      <a href="/">ลองเปิดหน้าแรกอีกครั้ง</a>
    </main>
  </body>
</html>
